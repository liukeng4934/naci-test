server:
  port: 8080

spring:
  application:
    name: naci-guestbook
  datasource:
    # 数据库连接配置：冒号后为默认值，本地演示可直接使用；不一致时改这里或设置同名环境变量（DB_URL / DB_USERNAME / DB_PASSWORD）覆盖
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/naci_guestbook?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}      # 数据库用户名，默认 root
    password: ${DB_PASSWORD:123456}    # 数据库密码，默认 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.naci.guestbook.model.entity
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.naci.guestbook: INFO
    org.mybatis: INFO
